body.auth-open{overflow:hidden}

/* ---- acabamento marketplace ---- */
.hero{position:relative;overflow:hidden}
.hero-art{box-shadow:inset 0 0 0 1px #ffffff14,0 18px 40px #10243e2e;background:linear-gradient(150deg,var(--navy),#1c466b)}
.hero-art span{font-size:11px;letter-spacing:2.4px;font-weight:800;color:#a8c6de;text-transform:uppercase}
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.trust>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;color:var(--navy);box-shadow:0 4px 12px #10243e0a}

/* ============================================================
   MOBILE — layout proprio de smartphone (ate 820px)
   Somente apresentacao visual. Nenhum conteudo, texto ou funcao
   e alterado: as mesmas secoes, botoes e telas continuam iguais.
   ============================================================ */
html{-webkit-text-size-adjust:100%}

@media (max-width:820px){
  html,body{max-width:100%;overflow-x:hidden}
  body{font-size:15.5px;line-height:1.55;-webkit-tap-highlight-color:transparent}

  /* ---------- 1. CABECALHO: duas faixas curtas, nao um bloco alto ---------- */
  header{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;padding:10px 14px 12px}
  .brand{flex:1 1 100%;min-width:0;display:flex;align-items:center;gap:9px}
  .logo{width:38px;height:38px;flex:0 0 38px;border-radius:11px;font-size:19px}
  .brand>div{min-width:0}
  .brand h1{font-size:17px;line-height:1.15;letter-spacing:.2px;margin:0}
  .brand small{display:block;margin-top:1px;font-size:11px;line-height:1.3;color:#c8daea}
  .header-actions{display:flex;flex:1 1 100%;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;width:100%}
  .header-actions .btn{flex:1 1 0;width:auto;min-width:0;min-height:42px;padding:9px 12px;font-size:14px;border-radius:11px;white-space:nowrap}
  .header-actions>span{flex:1 1 100%;font-size:14px;padding:0 0 2px}

  /* ---------- 2. MENU: trilho deslizante, nunca cortado ---------- */
  nav{position:sticky;top:0;z-index:20;background:#fff}
  .navinner{display:flex;flex-wrap:nowrap;gap:6px;padding:8px 12px;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scroll-padding-left:12px}
  .navinner::-webkit-scrollbar{display:none}
  .navinner button{flex:0 0 auto;white-space:nowrap;min-height:38px;padding:8px 13px;font-size:13.5px;font-weight:750;color:var(--navy);background:#f6f9fc;border:1px solid var(--line);border-radius:999px;scroll-snap-align:start}
  .navinner button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .navinner button.active,.navinner button:hover{border-bottom-color:transparent}

  /* ---------- 3. ESTRUTURA: largura fluida, sem estouro ---------- */
  main{width:100%;max-width:100%;margin:14px auto 0;padding:0 14px 34px}
  .section{margin-top:22px}
  .section:first-child{margin-top:0}
  .section-head{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin-bottom:12px}
  .section-head h2,.section h2,.band h2{font-size:20px;line-height:1.25}
  .section-head .btn{width:100%}

  /* ---------- 4. HERO em leitura vertical ---------- */
  .hero{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding:20px 16px;border-radius:18px}
  .hero h2{font-size:clamp(27px,7.8vw,33px);line-height:1.14;letter-spacing:-.3px;margin:6px 0 10px}
  .hero .eyebrow{font-size:11px;letter-spacing:1.2px}
  .hero p{font-size:15.5px;line-height:1.6;margin:0;max-width:none}
  .pill{font-size:11px;padding:5px 10px}
  .hero .actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .hero .actions .btn{width:100%}
  .hero-art{order:2;padding:16px;border-radius:14px;min-height:0}
  .hero-art strong{font-size:23px;line-height:1.2}
  .hero-art p{font-size:14px}
  .hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
  .hero-stats b{font-size:19px}
  .hero-stats span{font-size:10px;letter-spacing:.2px;line-height:1.25}

  /* ---------- 5. COLUNAS DESKTOP -> BLOCOS EMPILHADOS ---------- */
  .grid,.grid.two,.steps,.kpi,.formgrid{display:grid!important;grid-template-columns:1fr!important;gap:14px!important}
  .trust{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
  .card,.step,.panel,.kpi-card,.empty{width:100%;max-width:100%;min-width:0;padding:16px;border-radius:14px}
  .card:hover{transform:none;box-shadow:0 4px 15px #10243e08}
  .card h3,.step h3{font-size:17px;line-height:1.3;margin:0 0 6px}
  .card p{font-size:14.5px;line-height:1.55}
  .stat{font-size:24px}
  .cat-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .cat-ico{width:42px;height:42px;font-size:20px;margin-bottom:6px}
  .trust>div{width:100%;min-width:0;padding:11px 12px;font-size:12.5px;gap:8px;border-radius:12px}

  /* ---------- 6. TEXTO: sem quebra no meio das palavras ---------- */
  h1,h2,h3,h4,p,li,td,th,label,a,strong,span,b,small{overflow-wrap:break-word;word-break:normal;hyphens:none}
  .pix-key b,.wallet-number,.pix-row b{word-break:break-all;overflow-wrap:anywhere}

  /* ---------- 7. BOTOES: alvo de dedo, sem inflar a tela ---------- */
  .btn{width:100%;min-height:46px;padding:11px 16px;font-size:15px;border-radius:11px}
  .btn.small{width:auto;min-height:40px;padding:9px 13px;font-size:14px}
  .actions{flex-direction:column;gap:10px}
  .actions .btn{width:100%}
  .actions .btn.small{width:100%}
  .itemtop .actions{flex-direction:column;width:100%}

  /* ---------- 8. FORMULARIOS ---------- */
  label{font-size:13.5px;margin:12px 0 5px}
  input,select,textarea{font-size:16px;min-height:48px;padding:12px 13px;border-radius:11px}
  textarea{min-height:110px}
  .password-wrap{gap:8px}
  .eye-btn{min-height:48px;min-width:58px;font-size:14px;padding:10px 12px}
  .tabs{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;min-height:38px;font-size:13.5px;padding:8px 13px;white-space:nowrap}

  /* ---------- 9. LISTAS, PERFIS, PIX ---------- */
  .item{padding:14px 0}
  .item h3{font-size:16.5px}
  .itemtop{flex-direction:column;align-items:flex-start;gap:6px}
  .pro-card{flex-direction:row;align-items:flex-start;gap:12px}
  .profile-photo,.pro-card .profile-photo{width:56px;height:56px;flex:0 0 56px;font-size:21px}
  .gallery img{width:112px;height:84px}
  .pix-box{padding:12px 14px;border-radius:12px}
  .pix-row{font-size:14px;gap:8px;flex-wrap:wrap}
  .pix-key{flex-direction:column;align-items:stretch;gap:8px;padding:11px 12px}
  .pix-key .btn{width:100%}
  .notice{padding:13px 14px;font-size:14.5px;border-radius:12px}

  /* ---------- 10. FAIXAS ESCURAS E BARRA DE USUARIO ---------- */
  .band,.user-bar{flex-direction:column;align-items:stretch;gap:12px;padding:18px 16px;border-radius:16px;width:100%}
  .band .btn,.user-bar .btn{width:100%}
  .user-bar h2{font-size:19px}
  .avatar{width:46px;height:46px;flex:0 0 46px;font-size:16px}

  /* ---------- 11. MODAL: folha deslizando do rodape ---------- */
  .modalback{display:flex;align-items:flex-end;justify-content:center;padding:0}
  .modal{width:100%;max-width:none;max-height:92vh;padding:16px 16px 24px;border-radius:18px 18px 0 0}
  .modalhead{position:sticky;top:0;z-index:2;background:#fff;padding:2px 0 8px;margin:-2px 0 4px}
  .modalhead h2{font-size:18px;line-height:1.25;padding-right:6px}
  .close{width:40px;height:40px;flex:0 0 40px;font-size:20px}

  /* ---------- 12. TABELAS, RODAPE, AVISOS ---------- */
  .tablewrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:460px}
  th,td{padding:9px 8px;font-size:13px}
  footer{padding:22px 16px;font-size:13.5px;line-height:1.7}
  #toast{left:12px;right:12px;bottom:14px;transform:none;max-width:none;text-align:center;font-size:14px;padding:11px 14px}
  img,iframe,video{max-width:100%;height:auto}
}

/* ---------- 13. REFINO PARA TELAS DE 360px ---------- */
@media (max-width:380px){
  body{font-size:15px}
  header{padding:9px 12px 11px}
  .brand h1{font-size:16px}
  .brand small{font-size:10.5px}
  .logo{width:35px;height:35px;flex:0 0 35px;font-size:18px}
  .header-actions .btn{font-size:13.5px;min-height:40px;padding:8px 10px}
  main{padding:0 12px 30px}
  .hero{padding:18px 14px}
  .hero h2{font-size:26px}
  .hero-stats b{font-size:17px}
  .card,.step,.panel,.kpi-card{padding:14px}
  .btn{font-size:14.5px}
  .section-head h2,.section h2,.band h2{font-size:19px}
}
</style>

var memStore={};

function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){memStore[k]=v;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){delete memStore[k];}}
/* ---------- se algo falhar, avisa na tela em vez de "nada acontece" ------ */
function showFatal(err){
  try{
    var msg=(err&&err.message)?err.message:String(err||"Erro inesperado");
    var bar=document.getElementById("jsErrorBar");
    if(!bar){
      bar=document.createElement("div");
      bar.id="jsErrorBar";
      bar.style.cssText="position:fixed;left:0;right:0;top:0;z-index:9999;background:#c0392b;color:#fff;padding:10px 14px;font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;box-shadow:0 4px 14px #0003";
      (document.body||document.documentElement).appendChild(bar);
    }
    bar.textContent="Aviso tecnico: "+msg+" - atualize a pagina (Ctrl+F5).";
  }catch(e){}
}
window.addEventListener("error",function(ev){ if(ev&&ev.error) showFatal(ev.error); });
window.addEventListener("unhandledrejection",function(ev){ if(ev) showFatal(ev.reason); });
/* ---------- botoes funcionam por delegacao (a prova de onclick bloqueado) */
function closestAct(node){
  while(node&&node.nodeType===1){
    if(node.hasAttribute&&(node.hasAttribute("data-act")||node.hasAttribute("data-page"))) return node;
    node=node.parentNode;
  }
  return null;
}
document.addEventListener("click",function(ev){
  var el=closestAct(ev.target);
  if(el){
    var act=el.getAttribute("data-act");
    var page=el.getAttribute("data-page");
    try{
      if(el.tagName==="A") ev.preventDefault();
      if(act==="login") openAuth("login");
      else if(act==="register") openAuth("register");
      else if(act==="close-auth") closeAuth();
      else if(act==="close-generic") closeGeneric();
      else if(act==="logout"){ var lp=logout(); if(lp&&lp.catch) lp.catch(showFatal); }
      else if(page){ var gp=go(page); if(gp&&gp.catch) gp.catch(showFatal); }
    }catch(e){ showFatal(e); }
    return;
  }
  if(ev.target&&ev.target.classList&&ev.target.classList.contains("modalback")){
    if(ev.target.id==="authModal") closeAuth();
    else if(ev.target.id==="genericModal") closeGeneric();
  }
},false);

},false);

function lhash(salt,pw){
  var s=String(salt)+"|"+String(pw)+"|domalpha";
  var a=5381,b=52711;
  for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=(((a<<5)+a)^c)>>>0;b=(((b<<5)-b)+c)>>>0;}
  return ("0000000"+a.toString(16)).slice(-8)+("0000000"+b.toString(16)).slice(-8);
}

function loadLocal(){

        return d;

  var s=localSeed();
  lsSet(LOCAL_KEY,JSON.stringify(s));

function localChatSummary(chat,viewerId){
  var otherId=chat.participants.filter(function(p){return p!==viewerId;})[0];
  var other=null;
  for(var i=0;i<ldb.users.length;i++){if(ldb.users[i].id===otherId){other=ldb.users[i];break;}}
  var msgs=ldb.messages.filter(function(m){return m.chatId===chat.id;}).sort(function(a,b){return a.createdAt.localeCompare(b.createdAt);});
  var last=msgs.length?msgs[msgs.length-1]:null;
  var unread=ldb.messages.filter(function(m){
    return m.chatId===chat.id&&m.fromId!==viewerId&&(m.readBy||[]).indexOf(viewerId)<0;
  }).length;
  return {
    id:chat.id,
    other:other?localPub(other):null,
    lastMessage:last?{text:last.text,fromId:last.fromId,createdAt:last.createdAt}:null,
    unread:unread,
    lastAt:chat.lastAt||chat.createdAt
  };
}

async function localApi(method,url,body){
  ensureLocal();
  var m=String(method||"GET").toUpperCase();
  var raw=String(url||"");
  var qi=raw.indexOf("?");
  var pathPart=qi>=0?raw.slice(0,qi):raw;
  var query={};
  if(qi>=0){
    raw.slice(qi+1).split("&").forEach(function(pair){
      if(!pair) return;
      var eq=pair.indexOf("=");
      var k=decodeURIComponent(eq<0?pair:pair.slice(0,eq));
      var v=eq<0?"":decodeURIComponent(pair.slice(eq+1));
      query[k]=v;
    });
  }
  var seg=pathPart.split("/").filter(function(s){return !!s;});
  var b=body||{};
  var user=localUserFromToken();
  var i;

  function needAuth(){
    if(!user) throw lerr("Faça login para continuar.",401);
    if(user.status==="banido") throw lerr("Conta suspensa. Fale com a administração.",403);
    return user;
  }
  function needAdmin(){
    needAuth();
    if(user.role!=="admin"&&user.role!=="owner") throw lerr("Acesso restrito à administração.",403);
    return user;
  }
  function save(){saveLocal();}

  if(seg[0]==="health") return {ok:true,app:"DOM ALPHA AJATO",users:ldb.users.length,jobs:ldb.jobs.length,mode:"local"};

  /* ------------------------------ contas ------------------------------ */
  if(seg[0]==="auth"&&seg[1]==="register"){
    var name=String(b.name||"").trim().slice(0,80);
    var email=String(b.email||"").trim().toLowerCase().slice(0,120);
    var pw=String(b.password||"");
    var role=(b.role==="professional"||b.role==="helper"||b.role==="client")?b.role:"client";
    if(name.length<3) throw lerr("Informe seu nome completo.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) throw lerr("Informe um e-mail válido.");
    if(pw.length<6) throw lerr("A senha deve ter pelo menos 6 caracteres.");
    if(ldb.users.some(function(u){return u.email===email;})) throw lerr("Este e-mail já está cadastrado.",409);
    var nu=localMakeUser({name:name,email:email,password:pw,role:role,city:b.city,state:b.state,category:b.category,bio:b.bio,phone:b.phone});
    if(role!=="client"&&!nu.category) nu.category="Reformas em geral";
    if(role==="professional"||role==="helper"){
      var tp=({professional:{key:"professional",name:"Alpha Diamante",points:100},helper:{key:"helper",name:"Alpha Ouro",points:80}})[role];
      nu.plan={key:tp.key,name:tp.name,since:new Date().toISOString(),until:addMonthsISO(2),trial:true};
      nu.trialUsed=true;
      localAddPoints(nu,tp.points);
    }
    ldb.users.push(nu);
    var tk=luid("s");
    ldb.sessions[tk]=nu.id;
    localNotify(nu.id,"Bem-vindo(a) ao DOM ALPHA AJATO! Complete seu perfil para aparecer nas buscas.");
    if(nu.plan) localNotify(nu.id,"Presente de boas-vindas: 2 meses do plano "+nu.plan.name+" grátis, válido até "+new Date(nu.plan.until).toLocaleDateString("pt-BR")+".");
    save();
    return {token:tk,user:localPub(nu,nu),trial:nu.plan||null};
  }
  if(seg[0]==="auth"&&seg[1]==="login"){
    var lemail=String(b.email||"").trim().toLowerCase();
    var lpw=String(b.password||"");
    var found=null;
    for(i=0;i<ldb.users.length;i++){if(ldb.users[i].email===lemail){found=ldb.users[i];break;}}
    if(!found||found.pwHash!==lhash(found.salt,lpw)) throw lerr("E-mail ou senha incorretos.",401);
    if(found.status==="banido") throw lerr("Conta suspensa. Fale com a administração.",403);
    var tk2=luid("s");
    ldb.sessions[tk2]=found.id;
    save();
    return {token:tk2,user:localPub(found,found)};
  }
  if(seg[0]==="auth"&&seg[1]==="logout"){
    if(state.token&&ldb.sessions[state.token]){delete ldb.sessions[state.token];save();}
    return {ok:true};
  }
  if(seg[0]==="auth"&&seg[1]==="me"){needAuth();return {user:localPub(user,user)};}
  if(seg[0]==="me"&&m==="PATCH"){
    needAuth();
    if(b.name!==undefined){
      var nn=String(b.name||"").trim().slice(0,80);
      if(nn.length<3) throw lerr("Informe seu nome completo.");
      user.name=nn;
    }
    if(b.phone!==undefined) user.phone=String(b.phone||"").trim().slice(0,30);
    if(b.city!==undefined) user.city=String(b.city||"").trim().slice(0,80);
    if(b.state!==undefined) user.state=String(b.state||"").trim().toUpperCase().slice(0,2);
    if(b.category!==undefined&&user.role!=="client") user.category=String(b.category||"").trim().slice(0,80);
    if(b.bio!==undefined) user.bio=String(b.bio||"").trim().slice(0,1200);
    if(b.photo!==undefined){
      if(b.photo===null) user.photo=null;
      else if(typeof b.photo==="string"&&b.photo.indexOf("data:image/")===0&&b.photo.length<3000000) user.photo=b.photo;
      else throw lerr("Foto inválida. Envie uma imagem JPG ou PNG pequena.");
    }
    save();
    return {user:localPub(user,user)};
  }

  /* --------------------------- profissionais -------------------------- */
  if(seg[0]==="professionals"){
    var cat=query.category||"";
    var q=String(query.q||"").toLowerCase();
    var city=String(query.city||"").toLowerCase();
    var list=ldb.users.filter(function(u){return (u.role==="professional"||u.role==="helper")&&u.status==="ativo";});
    if(cat) list=list.filter(function(u){return u.category===cat||(u.role==="helper"&&cat==="Ajudante");});
    if(city) list=list.filter(function(u){return String(u.city||"").toLowerCase().indexOf(city)>=0;});
    if(q) list=list.filter(function(u){
      return String(u.name||"").toLowerCase().indexOf(q)>=0||String(u.category||"").toLowerCase().indexOf(q)>=0||String(u.bio||"").toLowerCase().indexOf(q)>=0;
    });
    var nowMs=Date.now();
    var ranked=list.map(function(u){return localPub(u);}).sort(function(x,y){
      var xp=(x.plan&&new Date(x.plan.until).getTime()>nowMs)?1:0;
      var yp=(y.plan&&new Date(y.plan.until).getTime()>nowMs)?1:0;
      if(xp!==yp) return yp-xp;
      return (y.cyclePoints||0)-(x.cyclePoints||0)||(y.rating||0)-(x.rating||0);
    });
    return {professionals:ranked,total:ranked.length,categories:CATEGORIES};
  }
  if(seg[0]==="users"&&seg[1]){
    var vu=null;
    for(i=0;i<ldb.users.length;i++){if(ldb.users[i].id===seg[1]){vu=ldb.users[i];break;}}
    if(!vu) throw lerr("Perfil não encontrado.",404);
    var revs=ldb.reviews.filter(function(r){return r.toId===vu.id;})
      .sort(function(x,y){return y.createdAt.localeCompare(x.createdAt);})
      .slice(0,10)
      .map(function(r){
        var from=null;
        for(var k=0;k<ldb.users.length;k++){if(ldb.users[k].id===r.fromId){from=ldb.users[k];break;}}
        var o={};
        for(var key in r) o[key]=r[key];
        o.fromName=from?from.name:"Cliente";
        return o;
      });
    return {user:localPub(vu,user),reviews:revs};
  }

  /* ------------------------------ ranking ----------------------------- */
  if(seg[0]==="ranking"){
    var rankList=function(role){
      return ldb.users.filter(function(u){return u.role===role&&u.status==="ativo";})
        .map(function(u){return localPub(u);})
        .sort(function(x,y){
          return (y.cyclePoints||0)-(x.cyclePoints||0)||(y.points||0)-(x.points||0)||String(x.name).localeCompare(String(y.name));
        });
    };
    return {cycle:ldb.rankingCycle,professional:rankList("professional"),helper:rankList("helper")};
  }

  /* ------------------------------- planos ----------------------------- */
  if(seg[0]==="plans"&&seg[1]==="subscribe"){
    needAuth();
    var pkey=b.plan;
    var plan=LOCAL_PLANS[pkey];
    if(!plan) throw lerr("Plano inválido.");
    if(user.role!==pkey) throw lerr("Este plano é exclusivo para "+(pkey==="helper"?"ajudantes.":"profissionais."));
    user.plan={key:plan.key,name:plan.name,since:new Date().toISOString(),until:addMonthsISO(plan.durationMeses)};
    localAddPoints(user,plan.points);
    ldb.ledger.push({id:luid("l"),uid:user.id,type:"assinatura",amount:plan.price,desc:"Assinatura "+plan.name+" ("+plan.durationMeses+" meses)",date:new Date().toISOString()});
    localNotify(user.id,"Plano "+plan.name+" ativado! Você ganhou "+plan.points+" pontos e destaque no PERFUME.");
    save();
    return {user:localPub(user,user),plan:user.plan};
  }
  if(seg[0]==="plans") return {plans:LOCAL_PLANS,cycle:ldb.rankingCycle};

  /* --------------------------- oportunidades -------------------------- */
  if(seg[0]==="jobs"&&!seg[1]){
    if(m==="POST"){
      needAuth();
      if(["client","admin","owner"].indexOf(user.role)<0) throw lerr("Apenas contas de cliente podem publicar serviços.",403);
      var title=String(b.title||"").trim().slice(0,100);
      var desc=String(b.description||"").trim().slice(0,2000);
      var jcat=String(b.category||"").trim().slice(0,80);
      if(title.length<5) throw lerr("Descreva o título do serviço (mínimo 5 caracteres).");
      if(desc.length<10) throw lerr("Descreva o serviço com pelo menos 10 caracteres.");
      if(CATEGORIES.indexOf(jcat)<0) throw lerr("Escolha uma categoria válida.");
      var njob={
        id:luid("j"),clientId:user.id,title:title,description:desc,category:jcat,
        city:String(b.city||"").trim().slice(0,80)||user.city||"",
        state:(String(b.state||"").trim()||user.state||"").toUpperCase().slice(0,2),
        budget:Number(b.budget)||0,deadline:String(b.deadline||"").slice(0,10),
        status:"aberto",createdAt:new Date().toISOString()
      };
      ldb.jobs.push(njob);
      save();
      return {job:localJobView(njob,user)};
    }
    var status=query.status||"";
    var jc=query.category||"";
    var jq=String(query.q||"").toLowerCase();
    var mine=query.mine==="1";
    var jl=ldb.jobs.slice();
    if(mine){
      if(!user) throw lerr("Faça login para ver seus serviços.",401);
      jl=jl.filter(function(j){return j.clientId===user.id;});
    }
    if(status) jl=jl.filter(function(j){return j.status===status;});
    if(jc) jl=jl.filter(function(j){return j.category===jc;});
    if(jq) jl=jl.filter(function(j){
      return String(j.title||"").toLowerCase().indexOf(jq)>=0||String(j.description||"").toLowerCase().indexOf(jq)>=0;
    });
    jl.sort(function(x,y){return y.createdAt.localeCompare(x.createdAt);});
    return {jobs:jl.map(function(j){return localJobView(j,user);})};
  }
  if(seg[0]==="jobs"&&seg[1]){
    var job=null;
    for(i=0;i<ldb.jobs.length;i++){if(ldb.jobs[i].id===seg[1]){job=ldb.jobs[i];break;}}
    if(!job) throw lerr("Serviço não encontrado.",404);
    if(seg[2]==="complete"){
      needAuth();
      if(job.clientId!==user.id&&user.role!=="admin"&&user.role!=="owner") throw lerr("Apenas o cliente que publicou pode concluir.",403);
      if(job.status==="concluido") throw lerr("Este serviço já foi concluído.");
      job.status="concluido";
      job.completedAt=new Date().toISOString();
      var ct=null;
      for(i=0;i<ldb.contracts.length;i++){if(ldb.contracts[i].jobId===job.id&&ldb.contracts[i].status!=="cancelado"){ct=ldb.contracts[i];break;}}
      if(ct){
        ct.status="concluido";
        var proC=null;
        for(i=0;i<ldb.users.length;i++){if(ldb.users[i].id===ct.proId){proC=ldb.users[i];break;}}
        if(proC){
          proC.jobsDone=(proC.jobsDone||0)+1;
          localAddPoints(proC,30);
          localNotify(proC.id,"Serviço concluído: \""+job.title+"\". +30 pontos no ranking.");
        }
      }
      save();
      return {job:localJobView(job,user)};
    }
    if(seg[2]==="review"){
      needAuth();
      if(job.clientId!==user.id) throw lerr("Apenas o cliente pode avaliar.",403);
      if(job.status!=="concluido") throw lerr("Conclua o serviço antes de avaliar.");
      var stars=Number(b.stars);
      if(!(stars>=1&&stars<=5)) throw lerr("Escolha de 1 a 5 estrelas.");
      var ctr=null;
      for(i=0;i<ldb.contracts.length;i++){if(ldb.contracts[i].jobId===job.id&&ldb.contracts[i].status!=="cancelado"){ctr=ldb.contracts[i];break;}}
      if(!ctr) throw lerr("Não há profissional contratado para avaliar.");
      if(ldb.reviews.some(function(r){return r.jobId===job.id&&r.fromId===user.id;})) throw lerr("Você já avaliou este serviço.",409);
      var rv={id:luid("r"),jobId:job.id,fromId:user.id,toId:ctr.proId,stars:stars,comment:String(b.comment||"").trim().slice(0,600),createdAt:new Date().toISOString()};
      ldb.reviews.push(rv);
      var proR=null;
      for(i=0;i<ldb.users.length;i++){if(ldb.users[i].id===ctr.proId){proR=ldb.users[i];break;}}
      if(proR){
        proR.ratingSum=(proR.ratingSum||0)+stars;
        proR.ratingCount=(proR.ratingCount||0)+1;
        localNotify(proR.id,"Você recebeu uma avaliação de "+stars+" estrela(s).");
      }
      save();
      return {review:rv};
    }
    needAuth();
    var owner=job.clientId===user.id||user.role==="admin"||user.role==="owner";
    var props=ldb.proposals.filter(function(p){return p.jobId===job.id&&(owner||p.proId===user.id);})
      .map(function(p){
        var pu=null;
        for(var k=0;k<ldb.users.length;k++){if(ldb.users[k].id===p.proId){pu=ldb.users[k];break;}}
        var o={};
        for(var key in p) o[key]=p[key];
        o.proName=pu?pu.name:"Profissional";
        o.proRating=pu?localPub(pu):null;
        return o;
      });
    return {job:localJobView(job,user),proposals:props};
  }

  /* ------------------------------ propostas --------------------------- */
  if(seg[0]==="proposals"&&!seg[1]){
    needAuth();
    if(m==="POST"){
      if(user.role!=="professional"&&user.role!=="helper") throw lerr("Apenas profissionais e ajudantes enviam propostas.",403);
      var tjob=null;
      for(i=0;i<ldb.jobs.length;i++){if(ldb.jobs[i].id===b.jobId){tjob=ldb.jobs[i];break;}}
      if(!tjob) throw lerr("Serviço não encontrado.",404);
      if(tjob.clientId===user.id) throw lerr("Você não pode propor no seu próprio serviço.");
      if(tjob.status!=="aberto") throw lerr("Este serviço não está mais aberto.");
      if(ldb.proposals.some(function(p){return p.jobId===tjob.id&&p.proId===user.id;})) throw lerr("Você já enviou uma proposta para este serviço.",409);
      var price=Number(b.price);
      if(!(price>0)) throw lerr("Informe um valor válido para a proposta.");
      var pmsg=String(b.message||"").trim().slice(0,1000);
      if(pmsg.length<10) throw lerr("Escreva uma mensagem com pelo menos 10 caracteres.");
      var np={id:luid("p"),jobId:tjob.id,proId:user.id,price:price,days:Number(b.days)||0,message:pmsg,status:"pendente",createdAt:new Date().toISOString()};
      ldb.proposals.push(np);
      localNotify(tjob.clientId,user.name+" enviou uma proposta para \""+tjob.title+"\".");
      save();
      return {proposal:np};
    }
    var sent=(user.role==="professional"||user.role==="helper");
    var plist=ldb.proposals.filter(function(p){
      if(sent) return p.proId===user.id;
      return ldb.jobs.some(function(j){return j.id===p.jobId&&j.clientId===user.id;});
    }).sort(function(x,y){return y.createdAt.localeCompare(x.createdAt);}).map(function(p){
      var jj=null;
      for(var k=0;k<ldb.jobs.length;k++){if(ldb.jobs[k].id===p.jobId){jj=ldb.jobs[k];break;}}
      var pu=null;
      for(var k2=0;k2<ldb.users.length;k2++){if(ldb.users[k2].id===p.proId){pu=ldb.users[k2];break;}}
      var o={};
      for(var key in p) o[key]=p[key];
      o.jobTitle=jj?jj.title:"Serviço removido";
      o.jobStatus=jj?jj.status:"cancelado";
      o.jobBudget=jj?(jj.budget||0):0;
      o.clientId=jj?jj.clientId:null;
      o.proName=pu?pu.name:"Profissional";
      o.pro=pu?localPub(pu):null;
      return o;
    });
    return {proposals:plist,mode:sent?"sent":"received"};
  }
  if(seg[0]==="proposals"&&seg[1]){
    needAuth();
    var pp=null;
    for(i=0;i<ldb.proposals.length;i++){if(ldb.proposals[i].id===seg[1]){pp=ldb.proposals[i];break;}}
    if(!pp) throw lerr("Proposta não encontrada.",404);
    var pj=null;
    for(i=0;i<ldb.jobs.length;i++){if(ldb.jobs[i].id===pp.jobId){pj=ldb.jobs[i];break;}}
    if(!pj) throw lerr("Serviço não encontrado.",404);
    if(pj.clientId!==user.id) throw lerr("Apenas o cliente pode responder propostas.",403);
    if(pp.status!=="pendente") throw lerr("Esta proposta já foi respondida.");
    if(seg[2]==="accept"){
      if(pj.status!=="aberto") throw lerr("Este serviço não está mais aberto.");
      pp.status="aceita";
      pp.answeredAt=new Date().toISOString();
      ldb.proposals.forEach(function(other){
        if(other.jobId===pj.id&&other.id!==pp.id&&other.status==="pendente"){
          other.status="recusada";
          other.answeredAt=new Date().toISOString();
          localNotify(other.proId,"Sua proposta para \""+pj.title+"\" não foi escolhida desta vez.");
        }
      });
      pj.status="em_andamento";
      pj.hiredProId=pp.proId;
      var contract={id:luid("ct"),jobId:pj.id,proposalId:pp.id,clientId:pj.clientId,proId:pp.proId,price:pp.price,status:"ativo",createdAt:new Date().toISOString()};
      ldb.contracts.push(contract);
      var apro=null;
      for(i=0;i<ldb.users.length;i++){if(ldb.users[i].id===pp.proId){apro=ldb.users[i];break;}}
      if(apro){
        localAddPoints(apro,10);
        localNotify(apro.id,"Proposta aceita para \""+pj.title+"\". +10 pontos. Combine os detalhes no chat.");
      }
      localNotify(pj.clientId,"Você contratou "+(apro?apro.name:"o profissional")+" para \""+pj.title+"\".");
      var chat=localFindChat(pj.clientId,pp.proId);
      chat.lastAt=new Date().toISOString();
      save();
      return {proposal:pp,contract:contract,chatId:chat.id};
    }
    if(seg[2]==="reject"){
      pp.status="recusada";
      pp.answeredAt=new Date().toISOString();
      localNotify(pp.proId,"Sua proposta para \""+pj.title+"\" foi recusada.");
      save();
      return {proposal:pp};
    }
    throw lerr("Recurso não encontrado.",404);
  }

  /* -------------------------------- chat ------------------------------ */
  if(seg[0]==="chats"&&!seg[1]){
    needAuth();
    if(m==="POST"){
      var targetId=b.userId;
      if(!targetId) throw lerr("Informe com quem você quer conversar.");
      if(targetId===user.id) throw lerr("Você não pode conversar consigo mesmo.");
      var target=null;
      for(i=0;i<ldb.users.length;i++){if(ldb.users[i].id===targetId){target=ldb.users[i];break;}}
      if(!target) throw lerr("Pessoa não encontrada.",404);
      var ch=localFindChat(user.id,targetId);
      save();
      return {chat:localChatSummary(ch,user.id)};
    }
    var cl=ldb.chats.filter(function(c){return c.participants.indexOf(user.id)>=0;})
      .map(function(c){return localChatSummary(c,user.id);})
      .sort(function(x,y){return String(y.lastAt).localeCompare(String(x.lastAt));});
    return {chats:cl};
  }
  if(seg[0]==="chats"&&seg[1]&&seg[2]==="messages"){
    needAuth();
    var chat2=null;
    for(i=0;i<ldb.chats.length;i++){if(ldb.chats[i].id===seg[1]){chat2=ldb.chats[i];break;}}
    if(!chat2) throw lerr("Conversa não encontrada.",404);
    if(chat2.participants.indexOf(user.id)<0) throw lerr("Você não participa desta conversa.",403);
    if(m==="POST"){
      var text=String(b.text||"").trim().slice(0,2000);
      if(!text) throw lerr("Escreva uma mensagem.");
      var msg={id:luid("m"),chatId:chat2.id,fromId:user.id,text:text,createdAt:new Date().toISOString(),readBy:[user.id]};
      ldb.messages.push(msg);
      chat2.lastAt=msg.createdAt;
      var otherId=chat2.participants.filter(function(p){return p!==user.id;})[0];
      localNotify(otherId,"Nova mensagem de "+user.name+": "+text.slice(0,60));
      save();
      return {message:{id:msg.id,chatId:msg.chatId,fromId:msg.fromId,text:msg.text,createdAt:msg.createdAt,readBy:msg.readBy,mine:true,fromName:user.name}};
    }
    ldb.messages.forEach(function(mm){
      if(mm.chatId===chat2.id&&mm.fromId!==user.id){
        mm.readBy=Array.isArray(mm.readBy)?mm.readBy:[];
        if(mm.readBy.indexOf(user.id)<0) mm.readBy.push(user.id);
      }
    });
    save();
    var msgs=ldb.messages.filter(function(mm){return mm.chatId===chat2.id;})
      .sort(function(x,y){return x.createdAt.localeCompare(y.createdAt);})
      .map(function(mm){
        var fn="Usuário";
        for(var k=0;k<ldb.users.length;k++){if(ldb.users[k].id===mm.fromId){fn=ldb.users[k].name;break;}}
        return {id:mm.id,fromId:mm.fromId,text:mm.text,createdAt:mm.createdAt,fromName:fn,mine:mm.fromId===user.id};
      });
    return {chat:localChatSummary(chat2,user.id),messages:msgs};
  }

  /* ---------------------------- notificações -------------------------- */
  if(seg[0]==="notifications"&&seg[1]==="read"){
    needAuth();
    ldb.notifications.forEach(function(n){if(n.uid===user.id) n.read=true;});
    save();
    return {ok:true};
  }
  if(seg[0]==="notifications"){
    needAuth();
    var nl=ldb.notifications.filter(function(n){return n.uid===user.id;})
      .sort(function(x,y){return y.date.localeCompare(x.date);})
      .slice(0,60);
    return {notifications:nl,unread:nl.filter(function(n){return !n.read;}).length};
  }

  /* ------------------------------ denúncias --------------------------- */
  if(seg[0]==="reports"&&m==="POST"){
    needAuth();
    var reason=String(b.reason||"").trim().slice(0,600);
    if(!b.targetId||reason.length<5) throw lerr("Descreva o motivo da denúncia.");
    var rep={id:luid("rp"),fromId:user.id,targetId:b.targetId,reason:reason,status:"aberto",createdAt:new Date().toISOString()};
    ldb.reports.push(rep);
    save();
    return {report:rep};
  }

  /* ---------------------------- administração ------------------------- */
  if(seg[0]==="admin"){
    needAdmin();
    if(seg[1]==="overview"){
      var nowMs2=Date.now();
      return {
        users:ldb.users.length,
        professionals:ldb.users.filter(function(u){return u.role==="professional";}).length,
        helpers:ldb.users.filter(function(u){return u.role==="helper";}).length,
        clients:ldb.users.filter(function(u){return u.role==="client";}).length,
        banned:ldb.users.filter(function(u){return u.status==="banido";}).length,
        jobs:ldb.jobs.length,
        openJobs:ldb.jobs.filter(function(j){return j.status==="aberto";}).length,
        proposals:ldb.proposals.length,
        contracts:ldb.contracts.length,
        activePlans:ldb.users.filter(function(u){return u.plan&&new Date(u.plan.until).getTime()>nowMs2;}).length,
        revenue:ldb.ledger.reduce(function(s,l){return s+(Number(l.amount)||0);},0),
        openReports:ldb.reports.filter(function(r){return r.status==="aberto";}).length,
        cycle:ldb.rankingCycle
      };
    }
    if(seg[1]==="users"&&!seg[2]){
      return {users:ldb.users.slice().sort(function(x,y){return y.createdAt.localeCompare(x.createdAt);}).map(function(u){
        var o=localPub(u,user);
        o.email=u.email;
        o.role=u.role;
        return o;
      })};
    }
    if(seg[1]==="users"&&seg[2]){
      var au=null;
      for(i=0;i<ldb.users.length;i++){if(ldb.users[i].id===seg[2]){au=ldb.users[i];break;}}
      if(!au) throw lerr("Usuário não encontrado.",404);
      if(b.status!==undefined){
        if(b.status!=="ativo"&&b.status!=="banido") throw lerr("Status inválido.");
        if(au.id===user.id) throw lerr("Você não pode alterar o seu próprio status.");
        au.status=b.status;
        if(b.status==="banido"){
          Object.keys(ldb.sessions).forEach(function(tk3){if(ldb.sessions[tk3]===au.id) delete ldb.sessions[tk3];});
        }
      }
      if(b.role!==undefined){
        if(["client","professional","helper","admin"].indexOf(b.role)<0) throw lerr("Perfil inválido.");
        if(au.id===user.id) throw lerr("Você não pode alterar o seu próprio perfil.");
        au.role=b.role;
      }
      save();
      var out=localPub(au,user);
      out.email=au.email;
      out.role=au.role;
      return {user:out};
    }
    if(seg[1]==="reports"&&!seg[2]){
      return {reports:ldb.reports.slice().sort(function(x,y){return y.createdAt.localeCompare(x.createdAt);}).map(function(r){
        var o={};
        for(var key in r) o[key]=r[key];
        var from=null,tgt=null;
        for(var k=0;k<ldb.users.length;k++){
          if(ldb.users[k].id===r.fromId) from=ldb.users[k];
          if(ldb.users[k].id===r.targetId) tgt=ldb.users[k];
        }
        o.fromName=from?from.name:"Usuário";
        o.targetName=tgt?tgt.name:"Usuário";
        return o;
      })};
    }
    if(seg[1]==="reports"&&seg[2]){
      var rr=null;
      for(i=0;i<ldb.reports.length;i++){if(ldb.reports[i].id===seg[2]){rr=ldb.reports[i];break;}}
      if(!rr) throw lerr("Denúncia não encontrada.",404);
      rr.status=(b.status==="aberto")?"aberto":"resolvido";
      save();
      return {report:rr};
    }
    if(seg[1]==="cycle"){
      ldb.rankingCycle={start:new Date().toISOString(),end:addMonthsISO(2)};
      ldb.users.forEach(function(u){u.cyclePoints=0;});
      save();
      return {cycle:ldb.rankingCycle};
    }
  }

  throw lerr("Recurso não encontrado.",404);
}

/* --------------------------------- API ----------------------------------- */
function clearSession(){state.token="";state.me=null;lsDel(TOKEN_KEY);}
async function api(method,url,body){
  if(localMode) return localApi(method,url,body);
  var headers={"Content-Type":"application/json"};
  if(state.token) headers.Authorization="Bearer "+state.token;
  var res;
  try{
    res=await fetch("/api"+url,{method:method,headers:headers,body:body===undefined?undefined:JSON.stringify(body)});
  }catch(e){
    localMode=true;
    localNotice();
    return localApi(method,url,body);
  }
  var ctype=(res.headers&&res.headers.get)?String(res.headers.get("content-type")||""):"";
  if(ctype.indexOf("json")<0){
    localMode=true;
    localNotice();
    return localApi(method,url,body);
  }
  var data=null;
  try{data=await res.json();}catch(e){}
  if(!res.ok){
    if(res.status===401&&state.token) clearSession();
    throw new Error((data&&data.error)||"Não foi possível concluir a operação.");
  }
  return data||{};
}

async function subscribePlan(key){
  if(!me()){openAuth("login");return;}
  var r,u;
  try{ r=await api("GET","/plans"); }catch(e){ toast(e.message); return; }
  var p=(r.plans||{})[key];
  if(!p){toast("Plano indisponível.");return;}
  var pp=r.platformPix||{};
  u=me();
  if(pp.source!=="owner"||!pp.key){
    openGeneric("Pagamento indisponível",
      '<div class="notice red">O pagamento do plano está temporariamente indisponível: a chave PIX da conta do dono ainda não foi cadastrada.</div>'+
      '<div class="actions"><button class="btn outline" onclick="closeGeneric()">Fechar</button></div>');
    return;
  }
  if(!u.pixKey){
    openGeneric("Cadastre sua chave PIX",
      '<div class="notice">Para assinar o plano <b>'+esc(p.name)+'</b> você precisa cadastrar a chave PIX onde vai receber seus pagamentos.</div>'+
      '<p class="muted">A chave fica salva no seu perfil e é usada pelos clientes para te pagar.</p>'+
      '<div class="actions"><button class="btn gold" onclick="closeGeneric();state.dashTab=\'profile\';go(\'dashboard\')">Cadastrar chave PIX</button><button class="btn outline" onclick="closeGeneric()">Agora não</button></div>');
    return;
  }
  openGeneric("Pagamento via PIX — "+p.name,
    '<div class="pix-box">'+
      '<div class="pix-row"><span>Plano</span><b>'+esc(p.name)+'</b></div>'+
      '<div class="pix-row"><span>Período</span><b>'+p.durationMeses+' meses de divulgação</b></div>'+
      '<div class="pix-row total"><span>Valor</span><b>'+money(p.price)+'</b></div>'+
    '</div>'+
    '<p class="muted" style="margin:12px 0 6px">Pague com PIX na chave oficial da plataforma:</p>'+
    '<div class="pix-key"><div><div class="muted" style="font-size:12px">Chave PIX</div><b>'+esc(pp.key||"")+'</b><div class="muted" style="font-size:12px">Titular: '+esc(pp.holder||"DOM ALPHA AJATO")+'</div></div><button class="btn small" type="button" onclick="copyText(\''+esc(pp.key||"")+'\')">Copiar</button></div>'+
    '<div class="notice" style="font-size:13px">Esta é a chave PIX da conta do dono: todo valor de plano pago vai direto para ela.</div>'+
    '<form onsubmit="confirmPlanPix(event,\''+key+'\')"><div id="planPixError"></div>'+
      '<label>ID / comprovante da transação PIX</label><input id="planPixProof" required placeholder="Ex: E1234567890...">'+
      '<div class="notice" style="font-size:13px">Depois de pagar, informe o identificador do comprovante para liberar o plano.</div>'+
      '<div class="actions"><button class="btn gold" type="submit" style="flex:1">Já paguei — ativar plano</button></div>'+
    '</form>'+
    '<p class="muted" style="font-size:12px;margin-top:10px">Sua chave de recebimento: <b>'+esc(u.pixKey)+'</b></p>');
}

   '<span class="tag">'+esc(u.email||"")+'</span></div></div></div>'+
   '<div class="actions" style="margin:0">'+(isClient?'<button class="btn gold" onclick="openJobForm()">Publicar serviço</button>':'')+'<button class="btn outline" onclick="go(\'plans\')">Planos</button></div></div>'+
   '<div class="tabs" style="margin-top:18px">'+tabs.map(function(t){return '<button class="'+(state.dashTab===t[0]?"active":"")+'" onclick="setDashTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join("")+'</div>'+
   '<div id="dashBody"><div class="empty">Carregando...</div></div></section>';
  await renderDashTab();
}
async function setDashTab(tab){
  stopChatPolling();
  state.dashTab=tab;
  if(tab!=="chats") state.chatId=null;
  await renderDashboard();
}
async function renderDashTab(){
  var box=document.getElementById("dashBody");
  if(!box) return;
  try{
    if(state.dashTab==="overview") await dashOverview(box);
    else if(state.dashTab==="proposals") await dashProposals(box);
    else if(state.dashTab==="chats") await dashChats(box);
    else if(state.dashTab==="jobs") await dashJobs(box);
    else if(state.dashTab==="notifications") await dashNotifications(box);
    else await dashProfile(box);
  }catch(e){box.innerHTML='<div class="notice red">'+esc(e.message)+'</div>';}
}
async function dashOverview(box){
  var u=me();
  var props=await api("GET","/proposals").catch(function(){return {proposals:[],mode:"sent"};});
  var chats=await api("GET","/chats").catch(function(){return {chats:[]};});
  var notes=await api("GET","/notifications").catch(function(){return {notifications:[],unread:0};});
  var unreadChats=(chats.chats||[]).reduce(function(s,c){return s+(c.unread||0);},0);
  var pending=(props.proposals||[]).filter(function(p){return p.status==="pendente";}).length;
  var kpi=function(icon,label,value,extra){return '<div class="kpi-card"><div class="kpi-ico">'+icon+'</div><div><b>'+value+'</b><span>'+label+'</span><div class="muted" style="font-size:12px;margin-top:2px">'+(extra||"")+'</div></div></div>';};
  box.innerHTML='<div class="kpi">'+
    kpi("📩","Propostas",(props.proposals||[]).length,(props.mode==="sent"?"enviadas":"recebidas")+(pending?" · "+pending+" pendente(s)":""))+
    kpi("💬","Conversas",(chats.chats||[]).length,unreadChats?unreadChats+" não lida(s)":"tudo em dia")+
    kpi("🏆","Pontos PERFUME",(u.cyclePoints||0),planActive(u)?"Plano "+esc(u.plan.name):"Sem plano ativo")+
    kpi("✅","Obras concluídas",(u.jobsDone||0),ratingText(u))+
    kpi("🔔","Notificações",notes.unread||0,"não lidas")+
    kpi("💳","Plano",planActive(u)?esc(u.plan.name):"Sem plano",planActive(u)?((u.plan.trial?"grátis até ":"até ")+fmtDate(u.plan.until)):"ative para aparecer no topo")+
   '</div>'+
   '<div class="panel" style="margin-top:16px"><h3 style="margin:0 0 4px">Ações rápidas</h3><p class="muted" style="margin:0 0 12px">Tudo o que você mais usa em um clique.</p><div class="actions" style="margin:0">'+
   '<button class="btn outline" onclick="setDashTab(\'proposals\')">Ver propostas</button>'+
   '<button class="btn outline" onclick="setDashTab(\'chats\')">Abrir conversas</button>'+
   '<button class="btn outline" onclick="go(\'opportunities\')">Ver oportunidades</button>'+
   '<button class="btn gold" onclick="go(\'perfume\')">Ver ranking</button>'+
   ((u.role==="professional"||u.role==="helper")?'<button class="btn success" onclick="subscribePlan(\''+(u.role==="helper"?"helper":"professional")+'\')">Ativar plano</button>':'')+'</div></div>';
}
async function dashProposals(box){
  var r=await api("GET","/proposals");
  var list=r.proposals||[];
  if(!list.length){
    box.innerHTML='<div class="empty">'+(r.mode==="sent"?"Você ainda não enviou propostas. Veja as oportunidades abertas.":"Você ainda não recebeu propostas. Publique um serviço para receber orçamentos.")+'</div>';
    return;
  }
  box.innerHTML='<div class="card">'+list.map(function(p){
    var actions="";
    if(r.mode==="received"&&p.status==="pendente"){
      actions='<div class="actions"><button class="btn success small" onclick="acceptProposal(\''+p.id+'\')">Aceitar</button><button class="btn danger small" onclick="rejectProposal(\''+p.id+'\')">Recusar</button></div>';
    }
    return '<div class="item"><div class="itemtop"><div><b>'+esc(p.jobTitle)+'</b> '+(r.mode==="received"?"· "+esc(p.proName):"")+'<div class="muted">'+fmtDateTime(p.createdAt)+'</div></div><div><span class="tag gold">'+money(p.price)+'</span> '+statusTag(p.status)+'</div></div>'+
      '<p>'+esc(p.message)+'</p><p class="muted">Orçamento: a combinar'+(p.days?" · Prazo: "+p.days+" dia(s)":"")+'</p>'+actions+'</div>';
  }).join("")+'</div>';
}
async function dashChats(box){
  if(state.chatId){await renderChatWindow(box,state.chatId);return;}
  var r=await api("GET","/chats");
  var list=r.chats||[];
  if(!list.length){box.innerHTML='<div class="empty">Nenhuma conversa ainda. Abra o perfil de um profissional e clique em Conversar.</div>';return;}
  box.innerHTML='<div class="card">'+list.map(function(c){
    return '<div class="item"><div class="itemtop"><div><b>'+esc(c.other?c.other.name:"Usuário")+'</b> '+(c.other?planTag(c.other):"")+'<div class="muted">'+(c.lastMessage?esc(c.lastMessage.text.slice(0,70)):"Sem mensagens")+'</div></div>'+
      '<div style="text-align:right">'+(c.unread?'<span class="tag red">'+c.unread+' nova(s)</span>':'<span class="tag green">lida</span>')+'<div class="muted" style="font-size:12px">'+fmtDateTime(c.lastAt)+'</div></div></div>'+
      '<div class="actions"><button class="btn small" onclick="openChat(\''+c.id+'\')">Abrir conversa</button>'+(c.other?'<button class="btn outline small" onclick="openProfile(\''+c.other.id+'\')">Ver perfil</button>':'')+'</div></div>';
  }).join("")+'</div>';
}
async function openChat(chatId){
  stopChatPolling();
  state.chatId=chatId;
  state.dashTab="chats";
  await renderDashboard();
}
async function renderChatWindow(box,chatId){
  box.innerHTML='<div class="card"><div class="itemtop"><button class="btn outline small" onclick="closeChatWindow()">← Conversas</button><b id="chatTitle">Conversa</b></div>'+
    '<div id="chatMessages" style="max-height:340px;overflow:auto;margin:12px 0"></div>'+
    '<form onsubmit="sendMessage(event,\''+chatId+'\')"><div class="formgrid"><div class="full"><input id="chatInput" placeholder="Escreva uma mensagem..." autocomplete="off" maxlength="2000"></div></div>'+
    '<div class="actions"><button class="btn gold" type="submit">Enviar</button></div></form></div>';
  await loadMessages(chatId);
  state.chatTimer=setInterval(function(){loadMessages(chatId);},5000);
}
async function closeChatWindow(){
  stopChatPolling();
  state.chatId=null;
  await renderDashboard();
}
async function loadMessages(chatId){
  var wrap=document.getElementById("chatMessages");
  if(!wrap) return;
  try{
    var r=await api("GET","/chats/"+chatId+"/messages");
    var t=document.getElementById("chatTitle");
    if(t&&r.chat&&r.chat.other) t.textContent=r.chat.other.name;
    var msgs=r.messages||[];
    var nearBottom=wrap.scrollHeight-wrap.scrollTop-wrap.clientHeight<80;
    wrap.innerHTML=msgs.length?msgs.map(function(m){
      return '<div style="display:flex;justify-content:'+(m.mine?"flex-end":"flex-start")+';margin:6px 0"><div style="max-width:78%;padding:9px 12px;border-radius:12px;background:'+(m.mine?"var(--navy)":"#eef3f9")+';color:'+(m.mine?"#fff":"var(--text)")+'">'+
        '<div style="font-size:11px;opacity:.75;font-weight:700">'+esc(m.fromName)+' · '+fmtDateTime(m.createdAt)+'</div>'+esc(m.text)+'</div></div>';
    }).join(""):'<div class="empty">Nenhuma mensagem ainda. Diga olá!</div>';
    if(nearBottom) wrap.scrollTop=wrap.scrollHeight;
  }catch(e){wrap.innerHTML='<div class="notice red">'+esc(e.message)+'</div>';}
}
async function sendMessage(ev,chatId){
  ev.preventDefault();
  var input=document.getElementById("chatInput");
  var text=(input.value||"").trim();
  if(!text) return;
  input.value="";
  try{
    await api("POST","/chats/"+chatId+"/messages",{text:text});
    await loadMessages(chatId);
  }catch(e){toast(e.message);}
}
async function dashJobs(box){
  var u=me();
  if(u.role==="client"||u.role==="admin"||u.role==="owner"){
    var r=await api("GET","/jobs?mine=1");
    var list=r.jobs||[];
    box.innerHTML=list.length?'<div class="grid two">'+list.map(jobCard).join("")+'</div>':'<div class="empty">Você ainda não publicou serviços.<br><br><button class="btn gold" onclick="openJobForm()">Publicar meu primeiro serviço</button></div>';
  }else{
    var r2=await api("GET","/jobs?status=aberto");
    var l2=r2.jobs||[];
    box.innerHTML=l2.length?'<div class="grid two">'+l2.map(jobCard).join("")+'</div>':'<div class="empty">Nenhuma oportunidade aberta agora.</div>';
  }
}
async function dashNotifications(box){
  var r=await api("GET","/notifications");
  var list=r.notifications||[];
  box.innerHTML='<div class="card"><div class="itemtop"><h3>Notificações</h3>'+(r.unread?'<button class="btn outline small" onclick="markAllRead()">Marcar todas como lidas</button>':'')+'</div>'+
    (list.length?list.map(function(n){return '<div class="item"><div class="itemtop"><span>'+esc(n.text)+'</span>'+(n.read?'':'<span class="tag red">nova</span>')+'</div><div class="muted" style="font-size:12px">'+fmtDateTime(n.date)+'</div></div>';}).join(""):'<div class="empty">Nenhuma notificação.</div>')+'</div>';
}
async function markAllRead(){
  try{await api("POST","/notifications/read",{});await renderDashTab();toast("Notificações lidas.");}catch(e){toast(e.message);}
}
async function dashProfile(box){
  var u=me();
  var isWorker=u.role!=="client";
  box.innerHTML='<div class="card"><div class="pro-card">'+
    (u.photo?'<div class="profile-photo"><img id="profilePreview" src="'+u.photo+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover"></div>':'<div class="profile-photo" id="profilePreview">'+esc(initials(u.name))+'</div>')+
    '<div style="flex:1;min-width:0"><h3>'+esc(u.name)+' '+planTag(u)+'</h3><p class="muted">'+esc(roleLabel(u.role))+' · '+esc(u.city||"Cidade não informada")+(u.state?"/"+esc(u.state):"")+'</p><p>'+ratingText(u)+' · '+(u.jobsDone||0)+' obra(s) · '+(u.cyclePoints||0)+' pts</p>'+
    '<p class="muted">'+esc(u.email||"")+'</p></div></div>'+
    planStatusCard(u)+
    '<form onsubmit="saveProfile(event)" style="margin-top:14px"><div id="profileError"></div><div class="formgrid">'+
      '<div><label>Nome completo</label><input id="pfName" value="'+esc(u.name)+'" minlength="3" required></div>'+
      '<div><label>Telefone / WhatsApp</label><input id="pfPhone" value="'+esc(u.phone||"")+'"></div>'+
      '<div><label>Cidade</label><input id="pfCity" value="'+esc(u.city||"")+'"></div>'+
      '<div><label>UF</label><select id="pfState">'+UFS.map(function(s){return '<option value="'+s+'"'+(u.state===s?" selected":"")+'>'+s+'</option>';}).join("")+'</select></div>'+
      (isWorker?'<div class="full"><label>Categoria de trabalho</label><select id="pfCategory">'+CATEGORIES.map(function(c){return '<option value="'+esc(c)+'"'+(u.category===c?" selected":"")+'>'+esc(c)+'</option>';}).join("")+'</select></div>':'')+
      '<div class="full"><label>Sobre você</label><textarea id="pfBio" placeholder="Sua experiência e especialidades">'+esc(u.bio||"")+'</textarea></div>'+
      '<div class="full"><div class="pix-title">💠 Chave PIX para receber</div><p class="muted" style="margin:0 0 4px;font-size:13px">'+(u.pixKey?('Chave cadastrada: <b>'+esc(u.pixKey)+'</b> · os clientes usam esta chave para te pagar.'):'Nenhuma chave cadastrada ainda. Sem ela você não recebe pagamentos nem assina plano.')+'</p></div>'+
      '<div><label>Tipo de chave PIX</label><select id="pfPixType">'+PIX_TYPES_UI.map(function(t){return '<option value="'+t[0]+'"'+(u.pixKeyType===t[0]?" selected":"")+'>'+t[1]+'</option>';}).join("")+'</select></div>'+
      '<div><label>Chave PIX</label><input id="pfPixKey" value="'+esc(u.pixKey||"")+'" placeholder="CPF, e-mail, telefone ou aleatória"></div>'+
      '<div class="full"><label>Nome do titular da chave</label><input id="pfPixHolder" value="'+esc(u.pixHolder||u.name)+'"></div>'+
      '<div class="full"><label>Foto de perfil</label><input id="pfPhoto" type="file" accept="image/*" onchange="pickPhoto(this)"></div>'+
    '</div><div class="actions"><button class="btn gold" type="submit">Salvar alterações</button><button class="btn outline" type="button" onclick="logout()">Sair da conta</button></div></form></div>';
}
var pendingPhoto=null;
function pickPhoto(input){
  var file=input.files&&input.files[0];
  if(!file) return;
  if(file.size>1200000){toast("Escolha uma imagem menor que 1,2 MB.");input.value="";return;}
  var reader=new FileReader();
  reader.onload=function(){
    pendingPhoto=String(reader.result);
    var prev=document.getElementById("profilePreview");
    if(prev) prev.innerHTML='<img src="'+pendingPhoto+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">';
  };
  reader.readAsDataURL(file);
}
async function saveProfile(ev){
  ev.preventDefault();
  var box=document.getElementById("profileError");
  box.innerHTML="";
  var u=me();
  var body={name:document.getElementById("pfName").value.trim(),phone:document.getElementById("pfPhone").value.trim(),city:document.getElementById("pfCity").value.trim(),state:document.getElementById("pfState").value,bio:document.getElementById("pfBio").value.trim(),pixKeyType:(document.getElementById("pfPixType")||{}).value||"",pixKey:((document.getElementById("pfPixKey")||{}).value||"").trim(),pixHolder:((document.getElementById("pfPixHolder")||{}).value||"").trim()};
  var cat=document.getElementById("pfCategory");
  if(cat) body.category=cat.value;
  if(pendingPhoto) body.photo=pendingPhoto;
  try{
    var r=await api("PATCH","/me",body);
    state.me=r.user;
    pendingPhoto=null;
    updateHeader();
    toast("Perfil atualizado!");
    await renderDashboard();
  }catch(e){box.innerHTML='<div class="notice red">'+esc(e.message)+'</div>';}
}

/* ----------------------------- administracao ----------------------------- */
async function renderAdmin(){
  updateHeader();
  if(!isAdmin()){toast("Acesso restrito.");return;}
  var tabs=[["users","Usuários"],["reports","Denúncias"]];
  document.getElementById("app").innerHTML='<section class="section"><div class="section-head"><div><div class="eyebrow">ADMINISTRAÇÃO</div><h2>Painel do DOM ALPHA AJATO</h2></div><div class="actions"><button class="btn outline" onclick="resetCycle()">Iniciar novo ciclo do ranking</button></div></div><div id="adminStats" class="grid"></div><div class="tabs" style="margin-top:16px">'+tabs.map(function(t){return '<button class="'+(state.adminTab===t[0]?"active":"")+'" onclick="setAdminTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join("")+'</div><div id="adminBody"></div></section>';
  try{
    var o=await api("GET","/admin/overview");
    document.getElementById("adminStats").innerHTML='<div class="card"><h3>Usuários</h3><p class="stat">'+o.users+'</p><p class="muted">'+o.professionals+' profissionais · '+o.helpers+' ajudantes · '+o.clients+' clientes</p></div>'+
      '<div class="card"><h3>Serviços</h3><p class="stat">'+o.jobs+'</p><p class="muted">'+o.openJobs+' abertos · '+o.proposals+' propostas</p></div>'+
      '<div class="card"><h3>Planos ativos</h3><p class="stat">'+o.activePlans+'</p><p class="muted">Receita: '+money(o.revenue)+'</p></div>'+
      '<div class="card"><h3>Denúncias abertas</h3><p class="stat">'+o.openReports+'</p><p class="muted">Banidos: '+o.banned+'</p></div>';
  }catch(e){document.getElementById("adminStats").innerHTML='<div class="notice red">'+esc(e.message)+'</div>';}
  await renderAdminTab();
}
async function setAdminTab(tab){state.adminTab=tab;await renderAdmin();}
async function renderAdminTab(){
  var box=document.getElementById("adminBody");
  if(!box) return;
  try{
    if(state.adminTab==="users"){
      var r=await api("GET","/admin/users");
      var list=r.users||[];
      var souDono=!!(me()&&me().role==="owner");
      box.innerHTML=(souDono?'<div class="notice">Você é a conta do dono: só você pode tornar alguém administrador ou remover o acesso de ADM.</div>':'')+'<div class="tablewrap"><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Plano</th><th>Pontos</th><th>Status</th><th>Ações</th></tr>'+list.map(function(u){
        var roleBtn="";
        if(souDono&&u.role!=="owner"){
          roleBtn=u.role==="admin"
            ? '<button class="btn small outline" onclick="setUserRole(\''+u.id+'\',\'client\')">Remover ADM</button>'
            : '<button class="btn small dark" onclick="setUserRole(\''+u.id+'\',\'admin\')">Tornar ADM</button>';
        }
        return '<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email||"")+'</td><td>'+esc(roleLabel(u.role))+'</td><td>'+(planActive(u)?esc(u.plan.name):"—")+'</td><td>'+(u.cyclePoints||0)+'</td><td>'+statusTag(u.status)+'</td>'+
        '<td><div class="actions" style="margin:0">'+roleBtn+'<button class="btn small '+(u.status==="banido"?"success":"danger")+'" onclick="toggleBan(\''+u.id+'\',\''+(u.status==="banido"?"ativo":"banido")+'\')">'+(u.status==="banido"?"Reativar":"Banir")+'</button></div></td></tr>';
      }).join("")+'</table></div>';
    }else{
      var r2=await api("GET","/admin/reports");
      var reps=r2.reports||[];
      box.innerHTML=reps.length?'<div class="card">'+reps.map(function(rp){
        return '<div class="item"><div class="itemtop"><div><b>'+esc(rp.fromName)+'</b> denunciou <b>'+esc(rp.targetName)+'</b><div class="muted">'+fmtDateTime(rp.createdAt)+'</div></div>'+statusTag(rp.status)+'</div><p>'+esc(rp.reason)+'</p>'+
        (rp.status==="aberto"?'<div class="actions"><button class="btn success small" onclick="resolveReport(\''+rp.id+'\')">Marcar como resolvida</button></div>':'')+'</div>';
      }).join("")+'</div>':'<div class="empty">Nenhuma denúncia registrada.</div>';
    }
  }catch(e){box.innerHTML='<div class="notice red">'+esc(e.message)+'</div>';}
}
async function toggleBan(id,status){
  try{await api("PATCH","/admin/users/"+id,{status:status});toast("Usuário atualizado.");await renderAdmin();}catch(e){toast(e.message);}
}
async function setUserRole(id,role){
  try{await api("PATCH","/admin/users/"+id,{role:role});toast(role==="admin"?"Novo administrador definido.":"Acesso de administrador removido.");await renderAdmin();}catch(e){toast(e.message);}
}
async function resolveReport(id){
  try{await api("PATCH","/admin/reports/"+id,{status:"resolvido"});toast("Denúncia resolvida.");await renderAdmin();}catch(e){toast(e.message);}
}
async function resetCycle(){
  try{await api("POST","/admin/cycle",{});toast("Novo ciclo do PERFUME iniciado.");await renderAdmin();}catch(e){toast(e.message);}
}

/* --------------------------------- inicio -------------------------------- */
(async function boot(){
  if(state.token){
    try{var r=await api("GET","/auth/me");state.me=r.user;}catch(e){clearSession();}
  }
  updateHeader();
  try{await go("home");}catch(e){}
})().catch(function(e){ showFatal(e); });
</script>
</body>
